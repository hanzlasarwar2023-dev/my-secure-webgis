# ===========================================================================
#  Render Blueprint - deploy with:  New > Blueprint > select this repo
#  Note: Render's free Postgres expires after 30 days. For a truly permanent
#  free database use Supabase or Neon (see README.md) and set DATABASE_URL
#  manually instead of using the `databases` block below.
# ===========================================================================
services:
  - type: web
    name: pu-webgis
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.11.0"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JOIN_CODE
        sync: false
      - key: DB_SSL
        value: "true"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: MIN_PASSWORD_LENGTH
        value: "8"
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: DATABASE_URL
        fromDatabase:
          name: pu-webgis-db
          property: connectionString

databases:
  - name: pu-webgis-db
    databaseName: puwebgis
    user: puwebgis
    plan: free
    postgresMajorVersion: "16"
